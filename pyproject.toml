[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sploit"
version = "0.2.0"
description = "Metasploit-style exploitation framework for testing MCP servers and MCP security gateways."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prasanna Kumar Surendran" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-security",
    "llm-security",
    "ai-security",
    "prompt-injection",
    "tool-poisoning",
    "exploit-framework",
    "penetration-testing",
    "red-team",
    "purple-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-sploit = "msploit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msploit"]
