[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sploit"
version = "0.2.0"
description = "Metasploit-style exploitation framework for testing MCP servers and MCP security gateways."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prasanna Kumar Surendran" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-sploit = "msploit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msploit"]
